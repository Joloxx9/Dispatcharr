name: Fork image

# Builds ghcr.io/<owner>/dispatcharr from the `custom` branch (upstream main +
# local fixes). The Python/system layer comes from the official upstream
# base image, so only the app layer is rebuilt here.

on:
  push:
    branches: [custom]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and timestamp
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "TIMESTAMP=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            REPO_OWNER=dispatcharr
            REPO_NAME=dispatcharr
            BASE_TAG=base
            TIMESTAMP=${{ env.TIMESTAMP }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:custom
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
